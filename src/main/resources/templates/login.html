<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Catálogo de Máquinas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="container" style="max-width: 400px;">
  <div class="card shadow border-0">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">Área Restrita</h3>
        <p class="text-muted small">Autenticação do Administrador</p>
      </div>

      <!-- Alerta de Erro -->
      <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- Alerta de Sucesso -->
      <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <form th:action="@{/fazer-login}" method="post">
        <div class="mb-3">
          <label for="email" class="form-label fw-bold">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="admin@admin.com" required>
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label fw-bold">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar</button>
      </form>

      <div class="text-center mt-3">
        <a th:href="@{/catalogo}" class="text-decoration-none text-muted small">&larr; Voltar ao Catálogo Público</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
