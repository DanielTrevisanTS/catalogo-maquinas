<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Máquinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar Admin -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/maquinas}">⚙️ Painel Admin</a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/catalogo}" class="btn btn-outline-light btn-sm" target="_blank">Ver Vitrine</a>
            <a th:href="@{/logout}" class="btn btn-danger btn-sm">Sair</a>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <!-- Mensagens de Feedback -->
    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0">Gerenciamento de Equipamentos</h3>
        <a th:href="@{/admin/maquinas/novo}" class="btn btn-success">+ Nova Máquina</a>
    </div>

    <!-- Tabela do CRUD -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>
                            <a th:href="@{/admin/maquinas(ordenarPor='id', direcao=${direcao == 'asc' ? 'desc' : 'asc'})}" class="text-white text-decoration-none">
                                ID ⇳
                            </a>
                        </th>
                        <th>Imagem</th>
                        <th>
                            <a th:href="@{/admin/maquinas(ordenarPor='modelo', direcao=${direcao == 'asc' ? 'desc' : 'asc'})}" class="text-white text-decoration-none">
                                Modelo ⇳
                            </a>
                        </th>
                        <th>Marca</th>
                        <th>Categoria</th>
                        <th>
                            <a th:href="@{/admin/maquinas(ordenarPor='preco', direcao=${direcao == 'asc' ? 'desc' : 'asc'})}" class="text-white text-decoration-none">
                                Preço ⇳
                            </a>
                        </th>
                        <th>Promoção</th>
                        <th>Estoque</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${maquinas}">
                        <td th:text="${m.id}" class="fw-bold">1</td>
                        <td>
                            <img th:src="${m.imagemUrl != null && !m.imagemUrl.isBlank() ? m.imagemUrl : 'https://via.placeholder.com/50'}"
                                 alt="Thumbnail" class="rounded" style="width: 50px; height: 40px; object-fit: cover;">
                        </td>
                        <td th:text="${m.modelo}">Modelo</td>
                        <td th:text="${m.marca}">Marca</td>
                        <td><span class="badge bg-secondary" th:text="${m.categoria}">CATEGORIA</span></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(m.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                        <td>
                            <span th:if="${m.isEmPromocao()}" class="badge bg-danger" th:text="${m.promocao + '% OFF'}">PROMO</span>
                            <span th:unless="${m.isEmPromocao()}" class="text-muted small">-</span>
                        </td>
                        <td>
                            <span th:if="${m.isEsgotado()}" class="badge bg-warning text-dark">0 (Esgotado)</span>
                            <span th:unless="${m.isEsgotado()}" th:text="${m.estoque}">10</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/admin/maquinas/editar/{id}(id=${m.id})}" class="btn btn-outline-primary">Editar</a>
                                <a th:href="@{/admin/maquinas/deletar/{id}(id=${m.id})}"
                                   class="btn btn-outline-danger"
                                   onclick="return confirm('Confirma a exclusão deste item?')">Excluir</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(maquinas)}">
                        <td colspan="9" class="text-center py-4 text-muted">Nenhuma máquina cadastrada.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
