<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Máquinas de Construção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/catalogo}">🚜 Macro-Lego®</a>
        <div>
            <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Área Restrita</a>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <!-- Mensagens do Sistema -->
    <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>
    <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

    <!-- Painel de Filtros -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/catalogo}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-bold small">Modelo</label>
                    <input type="text" name="modelo" class="form-control" placeholder="Buscar modelo..." th:value="${modeloBusca}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold small">Categoria</label>
                    <select name="categoria" class="form-select">
                        <option value="">Todas as Categorias</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat}"
                                th:text="${cat}"
                                th:selected="${cat == categoriaSelecionada}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold small">Ordenar por</label>
                    <select name="ordenarPor" class="form-select">
                        <option value="id" th:selected="${param.ordenarPor == 'id'}">Padrão</option>
                        <option value="preco" th:selected="${param.ordenarPor == 'preco'}">Preço</option>
                        <option value="modelo" th:selected="${param.ordenarPor == 'modelo'}">Modelo</option>
                        <option value="ano" th:selected="${param.ordenarPor == 'ano'}">Ano</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-center pt-4">
                    <div class="form-check me-2">
                        <input class="form-check-input" type="checkbox" name="apenasPromocao" value="true" id="chkPromo" th:checked="${apenasPromocao}">
                        <label class="form-check-label small" for="chkPromo">Promoção</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="apenasDisponiveis" value="true" id="chkDisp" th:checked="${apenasDisponiveis}">
                        <label class="form-check-label small" for="chkDisp">Em Estoque</label>
                    </div>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Filtrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Grid de Cards -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="m : ${maquinas}">
            <div class="card h-100 shadow-sm border-0">
                <img th:src="${m.imagemUrl != null && !m.imagemUrl.isBlank() ? m.imagemUrl : 'https://via.placeholder.com/400x250?text=Sem+Imagem'}"
                     class="card-img-top" alt="Imagem da Máquina" style="height: 220px; object-fit: cover;">

                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-secondary" th:text="${m.categoria}">CATEGORIA</span>
                        <span th:if="${m.isEmPromocao()}" class="badge bg-danger" th:text="${'-' + m.promocao + '%'}">PROMO</span>
                    </div>

                    <h5 class="card-title fw-bold mb-1" th:text="${m.modelo}">Modelo</h5>
                    <p class="card-text text-muted small mb-3" th:text="${m.marca + ' | Ano ' + m.ano}">Marca | Ano</p>

                    <div class="mt-auto">
                        <!-- Preços -->
                        <div class="mb-3">
                            <div th:if="${m.isEmPromocao()}">
                                <span class="text-decoration-line-through text-muted small me-2"
                                      th:text="${'R$ ' + #numbers.formatDecimal(m.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                                <span class="fs-4 fw-bold text-success"
                                      th:text="${'R$ ' + #numbers.formatDecimal(m.getPrecoComDesconto(), 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                            </div>
                            <div th:unless="${m.isEmPromocao()}">
                                <span class="fs-4 fw-bold text-dark"
                                      th:text="${'R$ ' + #numbers.formatDecimal(m.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <span th:if="${m.isEsgotado()}" class="badge bg-warning text-dark">Esgotado</span>
                            <span th:unless="${m.isEsgotado()}" class="badge bg-success" th:text="${'Estoque: ' + m.estoque}">Disponível</span>

                            <a th:href="@{/catalogo/detalhes/{id}(id=${m.id})}" class="btn btn-outline-primary btn-sm">Ver Detalhes</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lista Vazia -->
    <div th:if="${#lists.isEmpty(maquinas)}" class="text-center py-5">
        <p class="text-muted fs-5">Nenhuma máquina encontrada com os critérios informados.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
