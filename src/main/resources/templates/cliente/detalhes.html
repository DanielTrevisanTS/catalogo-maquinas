<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Máquina - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/catalogo}">🚜 Macro-Lego®</a>
    </div>
</nav>

<div class="container py-4">
    <div class="card shadow-sm border-0">
        <div class="row g-0">
            <div class="col-md-6">
                <img th:src="${maquina.imagemUrl != null && !maquina.imagemUrl.isBlank() ? maquina.imagemUrl : 'https://via.placeholder.com/600x400?text=Sem+Imagem'}"
                     class="img-fluid rounded-start w-100 h-100" style="object-fit: cover; min-height: 350px;" alt="Imagem da máquina">
            </div>
            <div class="col-md-6">
                <div class="card-body p-4 d-flex flex-column h-100">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-secondary" th:text="${maquina.categoria}">CATEGORIA</span>
                        <span th:if="${maquina.isEmPromocao()}" class="badge bg-danger fs-6" th:text="${'-' + maquina.promocao + '% OFF'}">PROMO</span>
                    </div>

                    <h2 class="card-title fw-bold" th:text="${maquina.modelo}">Modelo</h2>
                    <h5 class="text-muted mb-4" th:text="${'Marca: ' + maquina.marca + ' | Ano: ' + maquina.ano}">Marca | Ano</h5>

                    <!-- Preço -->
                    <div class="mb-4">
                        <div th:if="${maquina.isEmPromocao()}">
                            <p class="text-muted text-decoration-line-through mb-0"
                               th:text="${'De: R$ ' + #numbers.formatDecimal(maquina.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
                            <h3 class="fw-bold text-success"
                                th:text="${'Por: R$ ' + #numbers.formatDecimal(maquina.getPrecoComDesconto(), 1, 'POINT', 2, 'COMMA')}">R$ 0,00</h3>
                        </div>
                        <div th:unless="${maquina.isEmPromocao()}">
                            <h3 class="fw-bold text-dark"
                                th:text="${'R$ ' + #numbers.formatDecimal(maquina.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</h3>
                        </div>
                    </div>

                    <!-- Estoque -->
                    <div class="mb-4">
                        <span th:if="${maquina.isEsgotado()}" class="badge bg-warning text-dark p-2 fs-6">Esgotado no Estoque</span>
                        <span th:unless="${maquina.isEsgotado()}" class="badge bg-success p-2 fs-6" th:text="${'Unidades disponíveis: ' + maquina.estoque}">Estoque</span>
                    </div>

                    <!-- Descrição -->
                    <div class="mb-4">
                        <h6 class="fw-bold">Descrição do Equipamento:</h6>
                        <p class="text-secondary" th:text="${maquina.descricao != null && !maquina.descricao.isBlank() ? maquina.descricao : 'Sem descrição cadastrada.'}"></p>
                    </div>

                    <div class="mt-auto">
                        <a th:href="@{/catalogo}" class="btn btn-outline-secondary">&larr; Voltar ao Catálogo</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
