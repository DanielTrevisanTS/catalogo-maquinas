<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Máquina</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 600px;">
  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Cadastrar Nova Máquina</h4>
    </div>
    <div class="card-body">
      <form id="formMaquina">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Marca</label>
            <input type="text" id="marca" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Modelo</label>
            <input type="text" id="modelo" class="form-control" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Categoria</label>
          <select id="categoria" class="form-select" required>
            <option value="">Selecione...</option>
          </select>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Ano</label>
            <input type="number" id="ano" class="form-control" min="1900" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Preço (R$)</label>
            <input type="number" step="0.01" id="preco" class="form-control" required>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Estoque</label>
            <input type="number" id="estoque" class="form-control" value="1" min="0" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Desconto Promoção (%)</label>
            <input type="number" id="promocao" class="form-control" value="0" min="0" max="100">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">URL da Imagem</label>
          <input type="url" id="imagemUrl" class="form-control" placeholder="https://...">
        </div>

        <div class="mb-3">
          <label class="form-label">Descrição</label>
          <textarea id="descricao" class="form-control" rows="3"></textarea>
        </div>

        <div class="d-flex justify-content-between">
          <a href="/index.html" class="btn btn-secondary">Voltar</a>
          <button type="submit" class="btn btn-success">Salvar Máquina</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Carregar categorias no select
  fetch('/api/maquinas/categorias')
          .then(res => res.json())
          .then(cats => {
            const select = document.getElementById('categoria');
            cats.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
          });

  document.getElementById('formMaquina').addEventListener('submit', async (e) => {
    e.preventDefault();

    const maquina = {
      marca: document.getElementById('marca').value,
      modelo: document.getElementById('modelo').value,
      categoria: document.getElementById('categoria').value,
      ano: parseInt(document.getElementById('ano').value),
      preco: parseFloat(document.getElementById('preco').value),
      estoque: parseInt(document.getElementById('estoque').value),
      promocao: parseInt(document.getElementById('promocao').value),
      imagemUrl: document.getElementById('imagemUrl').value,
      descricao: document.getElementById('descricao').value
    };

    const res = await fetch('/api/maquinas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(maquina)
    });

    if (res.ok) {
      alert('Máquina cadastrada com sucesso!');
      window.location.href = '/index.html';
    } else {
      alert('Erro ao cadastrar máquina. Verifique os dados.');
    }
  });
</script>
</body>
</html>
