<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Máquinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">🚜 Catálogo de Máquinas</a>
        <a href="/maquinas/novo" class="btn btn-success">+ Cadastrar Máquina</a>
    </div>
</nav>

<div class="container my-4">
    <h2 class="mb-4">Máquinas Disponíveis</h2>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="maquina : ${maquinas}">
            <div class="card h-100 shadow-sm">
                <img th:src="${maquina.imagemUrl != null ? maquina.imagemUrl : 'https://via.placeholder.com/300x200'}" class="card-img-top" alt="Imagem da máquina">

                <div class="card-body">
                    <span class="badge bg-primary mb-2" th:text="${maquina.categoria}">ESCAVADEIRA</span>
                    <span th:if="${maquina.isEmPromocao()}" class="badge bg-danger mb-2">PROMOÇÃO</span>

                    <h5 class="card-title" th:text="${maquina.marca + ' ' + maquina.modelo}">Marca Modelo</h5>
                    <p class="card-text text-muted" th:text="${maquina.descricao}">Descrição breve...</p>

                    <p class="mb-1"><strong>Ano:</strong> <span th:text="${maquina.ano}">2022</span></p>

                    <div class="mt-3">
                        <span th:if="${maquina.isEmPromocao()}" class="text-decoration-line-through text-muted me-2"
                              th:text="'R$ ' + ${#numbers.formatDecimal(maquina.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>

                        <strong class="h4 text-success"
                                th:text="'R$ ' + ${#numbers.formatDecimal(maquina.getPrecoComDesconto(), 1, 'POINT', 2, 'COMMA')}">R$ 0,00</strong>
                    </div>
                </div>

                <div class="card-footer bg-transparent border-top-0">
                    <span th:if="${maquina.isEsgotado()}" class="text-danger fw-bold">Esgotado</span>
                    <span th:unless="${maquina.isEsgotado()}" class="text-muted" th:text="'Estoque: ' + ${maquina.estoque}">Estoque: 5</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
